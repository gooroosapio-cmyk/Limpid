<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740"><rect width="360" height="740" rx="22" fill="#101713"/><text x="20" y="35" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#F7F7EF">Chapitre 1 sur 1</text><text x="20" y="82" font-family="DejaVu Sans" font-size="23" font-weight="600" fill="#F7F7EF">Comment suivre les</text><text x="20" y="112" font-family="DejaVu Sans" font-size="23" font-weight="600" fill="#F7F7EF">deux prélèvements ?</text><text x="20" y="140" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#AFBBB2">Objectif : identifier les bases du calcul.</text><rect x="18" y="160" width="324" height="94" rx="12" fill="#342F1C"/><text x="32" y="185" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#F7F7EF">L’essentiel</text><text x="32" y="210" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#F7F7EF">• Les taux ont deux bases différentes.</text><text x="32" y="231" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#F7F7EF">• Chaque étape produit la suivante.</text><text x="20" y="290" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#F7F7EF">1.1 · Identifier les données</text><rect x="300" y="266" width="42" height="42" rx="10" fill="#243028"/><path d="m315 292 6-6 6 6" stroke="#F7F7EF" stroke-width="3" stroke-linecap="round" fill="none"/><text x="20" y="326" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#AFBBB2">Montant initial par action</text><text x="302" y="326" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#F7F7EF">8 €</text><text x="20" y="358" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#AFBBB2">Premier taux</text><text x="291" y="358" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#F7F7EF">25 %</text><text x="20" y="412" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#F7F7EF">1.2 · Suivre le calcul</text><rect x="300" y="386" width="42" height="42" rx="10" fill="#243028"/><path d="m315 412 6-6 6 6" stroke="#F7F7EF" stroke-width="3" stroke-linecap="round" fill="none"/><text x="20" y="447" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#F7F7EF">1. Premier prélèvement</text><text x="20" y="480" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#F7F7EF">8 × 0,25 = 2 €</text><text x="20" y="505" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#AFBBB2">Il reste 6 € à distribuer.</text><text x="20" y="547" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#F7F7EF">2. Second prélèvement</text><text x="20" y="580" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#F7F7EF">6 × 0,30 = 1,80 €</text><rect x="18" y="608" width="324" height="48" rx="10" fill="#243028"/><text x="32" y="639" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#F7F7EF">Montant final : 4,20 € par action</text><path d="M0 679h360" stroke="#AFBBB2" stroke-opacity=".35"/><text x="24" y="716" font-family="DejaVu Sans" font-size="13" font-weight="600" fill="#F7F7EF">Sommaire</text><text x="142" y="716" font-family="DejaVu Sans" font-size="13" font-weight="600" fill="#F7F7EF">Question</text><text x="263" y="716" font-family="DejaVu Sans" font-size="13" font-weight="600" fill="#F7F7EF">Options</text></svg>