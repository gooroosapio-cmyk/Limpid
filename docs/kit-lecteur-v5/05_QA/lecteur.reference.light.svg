<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740"><rect width="360" height="740" rx="22" fill="#F8F7F2"/><text x="20" y="35" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#142018">Chapitre 1 sur 1</text><text x="20" y="82" font-family="DejaVu Sans" font-size="23" font-weight="600" fill="#142018">Comment suivre les</text><text x="20" y="112" font-family="DejaVu Sans" font-size="23" font-weight="600" fill="#142018">deux prélèvements ?</text><text x="20" y="140" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#58645C">Objectif : identifier les bases du calcul.</text><rect x="18" y="160" width="324" height="94" rx="12" fill="#FFF5CB"/><text x="32" y="185" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#142018">L’essentiel</text><text x="32" y="210" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#142018">• Les taux ont deux bases différentes.</text><text x="32" y="231" font-family="DejaVu Sans" font-size="12" font-weight="400" fill="#142018">• Chaque étape produit la suivante.</text><text x="20" y="290" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#142018">1.1 · Identifier les données</text><rect x="300" y="266" width="42" height="42" rx="10" fill="#F0F0E8"/><path d="m315 292 6-6 6 6" stroke="#142018" stroke-width="3" stroke-linecap="round" fill="none"/><text x="20" y="326" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#58645C">Montant initial par action</text><text x="302" y="326" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#142018">8 €</text><text x="20" y="358" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#58645C">Premier taux</text><text x="291" y="358" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#142018">25 %</text><text x="20" y="412" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#142018">1.2 · Suivre le calcul</text><rect x="300" y="386" width="42" height="42" rx="10" fill="#F0F0E8"/><path d="m315 412 6-6 6 6" stroke="#142018" stroke-width="3" stroke-linecap="round" fill="none"/><text x="20" y="447" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#142018">1. Premier prélèvement</text><text x="20" y="480" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#142018">8 × 0,25 = 2 €</text><text x="20" y="505" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#58645C">Il reste 6 € à distribuer.</text><text x="20" y="547" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#142018">2. Second prélèvement</text><text x="20" y="580" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#142018">6 × 0,30 = 1,80 €</text><rect x="18" y="608" width="324" height="48" rx="10" fill="#F0F0E8"/><text x="32" y="639" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#142018">Montant final : 4,20 € par action</text><path d="M0 679h360" stroke="#58645C" stroke-opacity=".35"/><text x="24" y="716" font-family="DejaVu Sans" font-size="13" font-weight="600" fill="#142018">Sommaire</text><text x="142" y="716" font-family="DejaVu Sans" font-size="13" font-weight="600" fill="#142018">Question</text><text x="263" y="716" font-family="DejaVu Sans" font-size="13" font-weight="600" fill="#142018">Options</text></svg>